<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1c1c1e;
  }

  /* La carte est toujours le même élément : on anime ses propriétés,
     jamais un remplacement de vue — sinon le layout "snappe". */
  .task {
    width: 460px;
    border-radius: 16px;
    padding: 6px 10px;
    background: #fff;
    border: 1px solid transparent;
    box-shadow: 0 0 0 rgba(0,0,0,0);
    cursor: pointer;
    transition:
      padding    .35s cubic-bezier(.4,0,.2,1),
      background .35s cubic-bezier(.4,0,.2,1),
      border     .35s cubic-bezier(.4,0,.2,1),
      box-shadow .35s cubic-bezier(.4,0,.2,1);
  }
  .task.open {
    padding: 22px 24px;
    border-color: #ececec;
    box-shadow: 0 12px 40px rgba(0,0,0,.10);
    cursor: default;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .checkbox {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: #e4e4e4;
    cursor: pointer;
    transition: width .35s cubic-bezier(.4,0,.2,1),
                height .35s cubic-bezier(.4,0,.2,1),
                border-radius .35s cubic-bezier(.4,0,.2,1);
  }
  .task.open .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 6px;
  }

  .title {
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -.5px;
    transition: font-size .35s cubic-bezier(.4,0,.2,1);
  }
  .task.open .title { font-size: 22px; }

  /* Notes : replié à hauteur/opacité nulles, se déploie à l'ouverture. */
  .notes {
    font-size: 19px;
    color: #b6b6b6;
    max-height: 0;
    opacity: 0;
    margin-top: 0;
    overflow: hidden;
    transition:
      max-height .35s cubic-bezier(.4,0,.2,1),
      opacity    .3s ease .05s,
      margin-top .35s cubic-bezier(.4,0,.2,1);
  }
  .task.open .notes {
    max-height: 60px;
    opacity: 1;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <div class="task" id="task">
    <div class="row">
      <div class="checkbox" id="checkbox"></div>
      <div class="title">Checkbox</div>
    </div>
    <div class="notes">Notes</div>
  </div>

  <script>
    const task = document.getElementById('task');
    document.getElementById('checkbox').addEventListener('click', (e) => {
      e.stopPropagation();
      task.classList.toggle('open');
    });
  </script>
</body>
</html>
